<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examples</title>
<style>
  :root{
    --card:#ffffff; --border:#e6e8ec; --head:#1a1f2b; --text:#374151; --faint:#8b94a3; --btn:#d2d6de;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:auto;margin:0;background:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased}

  .ex-box{background:var(--card);border:1px solid var(--border);border-radius:10px}
  .ex-in{padding:15px 15px 14px}
  .ex-head{display:flex;align-items:center;gap:6px;margin-bottom:11px}
  .ex-title{font-size:16px;font-weight:700;color:var(--head);flex:none}
  .ex-count{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
  .ex-more{flex:none;margin-left:auto;font-family:var(--sans);font-size:14px;color:var(--head);background:var(--card);border:1px solid var(--btn);border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:500;white-space:nowrap}
  .ex-more:hover{background:#f7f8fa}
  .ex-list{margin:0;padding-left:20px;list-style:disc}
  .ex-list li{font-size:14px;color:var(--text);line-height:20px;margin-bottom:6px}
  .ex-list li:last-child{margin-bottom:0}
  .ex-list li::marker{color:#aeb4be}
  .ex-measure{position:absolute;visibility:hidden;left:-9999px;top:0;padding-left:20px;margin:0;list-style:disc}
  .ex-measure li{font-size:14px;line-height:20px;margin-bottom:6px}
</style>
</head>
<body>
  <div class="ex-box">
    <div class="ex-in">
      <div class="ex-head">
        <span class="ex-title">Examples</span>
        <span class="ex-count" id="count"></span>
        <button class="ex-more" id="moreBtn" type="button">More examples →</button>
      </div>
      <ul class="ex-list" id="list"></ul>
    </div>
  </div>
  <ul class="ex-measure" id="measure"></ul>

<script>
  var SETS = {
    "exit-first-action": [
      "Spend a day working from a coworking space in a different industry.",
      "Have coffee with someone in a field I’m curious about.",
      "Start a weekend side project or create one small artifact (prototype, article, landing page, demo).",
      "Attend a free online workshop or webinar in an area you’ve thought about switching to.",
      "Call a recruiter and ask what roles they’d place you in if you wanted to switch tomorrow.",
      "Read a few profiles of “A day in the life of [insert a career]”.",
      "Volunteer for a few hours with a nonprofit in a completely different field.",
      "Join a local meetup or networking group for professionals in a career you’re considering.",
      "Read a bestselling book or biography about someone working in a field that fascinates you."
    ],
    "flow-moments": [
      "Reorganizing a cluttered spreadsheet until the data suddenly made sense and felt clean.",
      "Role-playing a sales call with a teammate and laughing at how much energy it created.",
      "Writing a blog post and realizing you forgot to eat because the words were flowing.",
      "Sketching a product concept and realizing hours had passed without checking the clock.",
      "Building an automated workflow and enjoying the \"aha\" when all the pieces connected.",
      "Reviewing client feedback and seeing patterns emerge that sparked new ideas.",
      "Editing a long-form memo for 90 minutes because the argument became sharper with each pass.",
      "Prototyping a small tool and forgetting lunch while getting it to work.",
      "Coaching a teammate through a tough problem and feeling energized afterward."
    ],
    "regret-projects": [
      "Writing and publishing a book I’ve dreamed of for years.",
      "Starting the small business I’ve been talking about since my twenties.",
      "Traveling to a country I’ve always wanted to explore and documenting the experience.",
      "Saying “I love you” or “I’m sorry” before it was too late.",
      "Watching the sunrise from the summit of a mountain I climbed myself.",
      "Creating art that moves people, even just one person, to tears.",
      "Taking a silent retreat for a month and discovering what surfaces.",
      "Giving away something valuable—money, art, or time—in a way that completely changes someone else’s life.",
      "Living without technology for a stretch and rediscovering what fills the quiet."
    ]
  };
  var ITEMS = SETS[new URLSearchParams(location.search).get("set")] || SETS["exit-first-action"];
  var MAX_PER_PAGE = 3;   // never more than 3 bullets at once

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var li = function(t){return "<li>"+esc(t)+"</li>";};
  var list=document.getElementById("list"), count=document.getElementById("count"),
      moreBtn=document.getElementById("moreBtn"), head=document.querySelector(".ex-head"),
      measure=document.getElementById("measure");
  var pages=[[]], page=0;

  function computePages(){
    // up to 3 bullets, but never more than fits the height the embed gives us,
    // so it can't scroll or clip on a short (mobile) embed.
    var TARGET=document.documentElement.clientHeight;
    var avail=TARGET - head.offsetHeight - 40; // paddings + head margin
    measure.style.width=list.clientWidth+"px";
    var out=[], cur=[];
    for(var i=0;i<ITEMS.length;i++){
      cur.push(ITEMS[i]);
      measure.innerHTML=cur.map(li).join("");
      if(cur.length>MAX_PER_PAGE || (measure.offsetHeight>avail && cur.length>1)){
        cur.pop(); out.push(cur); cur=[ITEMS[i]];
      }
    }
    if(cur.length) out.push(cur);
    return out;
  }
  function render(){
    pages=computePages();
    if(page>=pages.length) page=0;
    list.innerHTML=pages[page].map(li).join("");
    count.textContent=(page+1)+"/"+pages.length;
    var multi=pages.length>1;
    moreBtn.style.display=multi?"":"none"; count.style.display=multi?"":"none";
    try{ parent.postMessage({type:"resize",height:document.body.scrollHeight},"*"); }catch(e){}
  }
  moreBtn.addEventListener("click",function(){ page=(page+1)%pages.length; render(); });
  render();
  var t; window.addEventListener("resize",function(){ clearTimeout(t); t=setTimeout(render,120); });
</script>
</body>
</html>
